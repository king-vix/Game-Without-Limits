<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Without Limits</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050713;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 30, 0.95);
            border-bottom: 1px solid #142b57;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00c8ff;
            text-shadow: 0 0 12px #008cff;
        }
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .menu-toggle div {
            width: 25px;
            height: 3px;
            background: white;
            margin: 4px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #00c8ff;
        }
        .top-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .search-bar {
            margin: 20px;
            display: flex;
            justify-content: center;
        }
        .search-bar input {
            width: 80%;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            outline: none;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .content {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        /* Admin Panel */
        .admin-login {
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: #050713;
        }
        .admin-login form {
            background: rgba(10, 13, 35, 0.94);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(100, 110, 255, 0.3);
        }
        .admin-login h2 {
            margin-bottom: 20px;
            color: #00c8ff;
        }
        .admin-login input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #30365e;
            background: #070918;
            color: white;
        }
        .admin-login button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6672ff, #8a4dff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .admin-login button:hover {
            transform: translateY(-3px);
        }
        /* Responsive */
        @media (max-width: 768px) {
            nav ul {
                display: none;
                flex-direction: column;
                width: 100%;
            }
            .menu-toggle {
                display: flex;
            }
        }
        @media (max-width: 768px) {
            nav {
                flex-direction: row;
                justify-content: space-between;
            }
            .top-right {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">GAME WITHOUT LIMITS</div>
        <div class="menu-toggle" id="menuToggle">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <nav>
            <ul id="navMenu">
                <li><a href="#">Need Help</a></li>
                <li><a href="#">My Account</a></li>
                <li><a href="#">Orders</a></li>
                <li><a href="#">Payments</a></li>
                <li><a href="#">Vouchers</a></li>
                <li><a href="#">Categories</a></li>
            </ul>
        </nav>
        <div class="top-right">
            <input type="text" class="search-bar" placeholder="Search...">
            <a href="#" onclick="showAdmin()">Sign In (Admin)</a>
            <a href="#">🛒 Cart</a>
        </div>
    </header>
    <main>
        <div class="content">
            <h1>Welcome to Game Without Limits</h1>
            <p>Your one-stop shop for the best gaming equipment and more!</p>
        </div>
    </main>

    <!-- Admin Login Panel -->
    <div class="admin-login" id="adminLogin">
        <form onsubmit="handleAdminLogin(event)">
            <h2>Admin Login</h2>
            <input type="email" id="adminEmail" placeholder="Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        // Toggle mobile menu
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        menuToggle.addEventListener('click', () => {
            navMenu.style.display = (navMenu.style.display === 'flex') ? 'none' : 'flex';
        });

        // Show admin login
        function showAdmin() {
            document.getElementById('adminLogin').style.display = 'flex';
        }

        // Handle admin login form (this is just a placeholder, you'd add your logic here)
        function handleAdminLogin(event) {
            event.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            // Here, you'd check credentials against your backend or Firebase
            if (email === 'kingvix691@gmail.com' && password === 'securepassword123') {
                alert('Admin login successful! Redirecting to admin panel...');
                // Redirect to admin panel or show admin controls
                // Example: window.location.href = '/admin.html';
            } else {
                alert('Invalid admin credentials.');
            }
        }
    </script>
</body>
</html>
