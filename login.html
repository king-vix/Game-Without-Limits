
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyVix | Login</title>

  <style>
    :root {
      --bg: #07110b;
      --card: #101c14;
      --green: #39f582;
      --text: #effff2;
      --muted: #9bb5a1;
      --border: #263c2d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(57, 245, 130, 0.08);
    }

    .logo {
      margin-bottom: 25px;
      color: var(--green);
      font-size: 30px;
      font-weight: 900;
      text-align: center;
    }

    .logo span {
      color: white;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 27px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 25px;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tabs button {
      width: 50%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--green);
      color: #06130a;
      border-color: var(--green);
    }

    label {
      display: block;
      margin: 13px 0 7px;
      color: var(--muted);
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #08130b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
    }

    .submit-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #06130a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #69ffa0;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .back {
      display: block;
      margin-top: 24px;
      color: var(--green);
      text-align: center;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">Study<span>Vix</span> ✦</div>

    <h1 id="heading">Welcome back!</h1>

    <p class="subtitle" id="subtitle">
      Sign in to continue your learning journey.
    </p>

    <div class="tabs">
      <button type="button" id="loginTab"
        class="active" onclick="switchMode('login')">
        Login
      </button>

      <button type="button" id="signupTab"
        onclick="switchMode('signup')">
        Create account
      </button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Your name</label>
        <input id="fullName" type="text"
          placeholder="Enter your name" autocomplete="name">
      </div>

      <label for="email">Email address</label>
      <input id="email" type="email"
        placeholder="you@example.com"
        autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        minlength="6" required>

      <button class="submit-btn" type="submit" id="submitBtn">
        Login to StudyVix
      </button>

      <p id="message" role="status"></p>
    </form>

    <a class="back" href="./index.html">
      ← Back to StudyVix
    </a>
  </main>

  <script>
    let mode = "login";

    function switchMode(newMode) {
      mode = newMode;

      const isSignup = mode === "signup";

      document.getElementById("heading").textContent =
        isSignup ? "Create your account" : "Welcome back!";

      document.getElementById("subtitle").textContent =
        isSignup
          ? "Join StudyVix and start learning smarter."
          : "Sign in to continue your learning journey.";

      document.getElementById("nameField").classList.toggle(
        "hidden", !isSignup
      );

      document.getElementById("fullName").required = isSignup;

      document.getElementById("loginTab").classList.toggle(
        "active", !isSignup
      );

      document.getElementById("signupTab").classList.toggle(
        "active", isSignup
      );

      document.getElementById("submitBtn").textContent =
        isSignup ? "Create my account" : "Login to StudyVix";

      document.getElementById("password").autocomplete =
        isSignup ? "new-password" : "current-password";

      document.getElementById("message").textContent = "";
    }

    document.getElementById("authForm").addEventListener(
      "submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "The login design is ready! Real account access will work after we connect Supabase.";
      }
    );
  </script>
</body>
</html>
